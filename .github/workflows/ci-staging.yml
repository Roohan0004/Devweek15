name: wf-ci-staging
on:
  pull_request:
    branches:
      - "release/**"

jobs:
  ci-staging-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Linting HTML and CSS files
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"

      - name: Build
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist"
